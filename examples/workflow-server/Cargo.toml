[package]
name = "workflow-server"
version = "0.1.0"
edition = "2021"

[dependencies]
mcp-authorization = { path = "../../crates/mcp-authorization" }
rmcp = { version = "1.4", features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
