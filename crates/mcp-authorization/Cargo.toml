[package]
name = "mcp-authorization"
version = "0.1.0"
edition = "2021"

[dependencies]
mcp-authorization-macros = { path = "../mcp-authorization-macros" }
rmcp = { version = "1.4", features = ["server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
